<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Az Auto Glass</title>
  <meta name="description" content="Thank you for requesting a quote from Az Auto Glass. We'll be in touch shortly.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    This page is the no-JavaScript fallback destination for the quote
    form (see the form's `action` attribute in index.html). Visitors
    with JavaScript enabled will normally see an inline success
    message instead and never land here — but Netlify still needs
    this page to exist as a valid redirect target.
  -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html#top" class="logo-link" aria-label="Az Auto Glass — home">
        <img src="images/logo.svg" alt="" width="42" height="42" class="logo-icon">
        <span class="logo-text">Az Auto Glass</span>
      </a>
    </div>
  </header>

  <main>
    <section class="legal-page">
      <div class="container container--narrow" style="text-align:center;">
        <h1>Thank You!</h1>
        <p>Your quote request has been received. A member of our team will be in touch shortly to follow up.</p>
        <p>Need help right away? Call us at <a href="tel:+15099910018">(509) 991-0018</a>.</p>
        <p><a href="index.html#top" class="btn btn-secondary">Back to Home</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container footer-bottom-inner">
        <p>&copy; 2026 Az Auto Glass. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
